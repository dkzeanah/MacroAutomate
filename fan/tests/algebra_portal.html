<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algebra 100 Practice Portal</title>
<style>
body{margin:12px auto;max-width:1050px;padding:0 22px;background:#eaf0f7;color:#162c47;font:18px/1.3 system-ui}main{padding:18px 30px;background:white;border-radius:16px}h1{font-size:28px;margin:0 0 8px}h2{font-size:23px;margin:12px 0 6px}.row{display:flex;gap:26px;align-items:center;flex-wrap:wrap}.row:first-child>label{display:flex;flex-direction:column;gap:5px}label{display:block;margin:6px 0}input[type=text]{font:inherit;padding:8px;width:220px;border:2px solid #869ab5;border-radius:5px}input[aria-label="Verification note"]{width:370px}select,button{font:inherit;padding:9px}button{margin:10px 12px 0 0}canvas{display:block;width:840px;max-width:100%;height:120px;background:#f2f6fb;border-radius:9px;margin:10px 0}output{display:block;background:#e7f4ec;padding:10px;min-height:65px;white-space:pre-wrap;font-size:16px}small{display:block;color:#42607f;font-size:15px}#progress{font-weight:600}#history{font-size:16px;margin:6px 0}.hint{font-size:16px;margin:8px 0}
</style>
<main><h1>Algebra 100 • Visual Automation Practice</h1><small>The application reads a screenshot, identifies controls, checks exact algebra, then drives native mouse and keyboard input.</small>
<div id="progress"></div><h2 id="heading"></h2><canvas id="equation" width="1680" height="290" role="img" aria-label="Visual algebra equation; read the image"></canvas>
<p class="hint">Solve over the real numbers. Enter all roots separated by a comma. Fractions are allowed.</p><section id="fields"></section>
<button id="check">Check answer</button><button id="next" disabled>Next problem</button><button id="restart">Restart demo</button>
<output id="feedback" aria-live="polite"></output><small id="events"></small><p id="history"></p></main>
<script>
// Equations exist only as drawn pixels, not DOM text or accessible math content.
const pages=[
{title:'Page 1 • Linear equation with fractions',topic:'Linear',variables:['x'],solutions:['7'],draw(c){fraction(c,'3x − 2','4',160,92);text(c,'−',285,100);fraction(c,'x + 1','3',400,92);text(c,'=',510,100);fraction(c,'25','12',595,92)}},
{title:'Page 2 • Quadratic equation',topic:'Quadratic',variables:['x'],solutions:['2, 3'],draw(c){text(c,'x',155,102);c.font='25px Georgia';c.fillText('2',178,78);text(c,'− 5x + 6 = 0',205,102)}},
{title:'Page 3 • Simultaneous equations',topic:'System',variables:['x','y'],solutions:['4','3'],draw(c){text(c,'2x + y = 11',220,65);text(c,'x − y = 1',220,122);text(c,'{',155,100)}},
{title:'Page 4 • Radical equation and domain check',topic:'Radical',variables:['x'],solutions:['4'],draw(c){text(c,'√',150,105);c.beginPath();c.moveTo(185,63);c.lineTo(340,63);c.stroke();text(c,'x + 5',190,105);text(c,'= x − 1',390,105)}}];
let stage=0,keys=0,backs=0,moves=0,clicks=0,verified=false;let history=[];
function text(c,s,x,y){c.font='42px Georgia';c.fillText(s,x,y)}
function fraction(c,n,d,x,y){c.font='35px Georgia';c.textAlign='center';c.fillText(n,x,y-20);c.beginPath();c.moveTo(x-68,y-9);c.lineTo(x+68,y-9);c.stroke();c.fillText(d,x,y+33);c.textAlign='left'}
function draw(){const c=document.querySelector('#equation').getContext('2d');c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,840,145);c.fillStyle='#172f52';c.strokeStyle='#172f52';c.lineWidth=2;pages[stage].draw(c)}
function render(){stage=Math.min(3,Math.max(0,Number(location.hash.replace('#stage',''))-1||0));verified=false;const p=pages[stage];document.querySelector('#heading').textContent=p.title;document.querySelector('#progress').textContent=`Stage ${stage+1} of 4 • Capture → Identify → Visual solve → Compile tool → Enter → Verify → Navigate`;const f=document.querySelector('#fields');f.innerHTML=`<div class="row">${p.variables.map(v=>`<label>Solution ${v}<input type="text" aria-label="Solution ${v}" autocomplete="off" data-var="${v}"></label>`).join('')}<label>Equation family<select aria-label="Equation family">${['Linear','Quadratic','System','Radical'].map(t=>`<option>${t}</option>`).join('')}</select></label>${stage===0?'<label>Verification note<input id="note" type="text" aria-label="Verification note" autocomplete="off"></label>':''}</div><div class="row"><label><input type="checkbox" aria-label="All real solutions"> All real solutions</label><label><input type="checkbox" aria-label="Domain checked"> Domain checked</label><label><input type="checkbox" aria-label="Guess without verification" checked> Guess without verification</label></div>`;document.querySelector('#next').disabled=true;document.querySelector('#next').textContent=stage===3?'Finish demo':'Next problem';draw();update()}
function update(message=''){const answers=[...document.querySelectorAll('input[data-var]')].map(i=>`${i.dataset.var} = ${i.value||'…'}`).join('; ');const choices=[...document.querySelectorAll('input[type=checkbox]:checked')].map(i=>i.getAttribute('aria-label')).join(', ');document.querySelector('#feedback').textContent=`${message||'Gathered live input'}\n${answers}\nIdentified family: ${document.querySelector('select').value} • Selections: ${choices}`;document.querySelector('#events').textContent=`Native events — Keys: ${keys} · backspaces: ${backs} · pointer moves: ${moves} · clicks: ${clicks}`;document.querySelector('#history').textContent=history.join('  |  ')}
document.addEventListener('input',()=>{verified=false;document.querySelector('#next').disabled=true;update()});document.addEventListener('change',()=>{verified=false;document.querySelector('#next').disabled=true;update()});document.addEventListener('keydown',e=>{keys++;if(e.key==='Backspace')backs++;update()});document.addEventListener('pointermove',()=>{moves++;document.querySelector('#events').textContent=`Native events — Keys: ${keys} · backspaces: ${backs} · pointer moves: ${moves} · clicks: ${clicks}`});document.addEventListener('click',()=>{clicks++;update(verified?'Correct answer — exact practice validation passed.':'')});
document.querySelector('#check').onclick=()=>{const p=pages[stage],fields=[...document.querySelectorAll('input[data-var]')];const norm=s=>s.replace(/\s/g,'');verified=fields.every((f,i)=>norm(f.value)===norm(p.solutions[i]))&&document.querySelector('select').value===p.topic&&(stage!==0||document.querySelector('#note').value==='All roots verified by substitution')&&document.querySelector('[aria-label="All real solutions"]').checked&&document.querySelector('[aria-label="Domain checked"]').checked&&!document.querySelector('[aria-label="Guess without verification"]').checked;document.querySelector('#next').disabled=!verified;if(verified&&!history.some(h=>h.startsWith(`Page ${stage+1}:`)))history.push(`Page ${stage+1}: PASS (${p.variables.map((v,i)=>v+'='+fields[i].value).join('; ')})`);update(verified?'Correct answer — exact practice validation passed.':'Review required — answer or controls mismatch.')};
document.querySelector('#next').onclick=()=>{if(!verified)return;if(stage<3)location.hash=`stage${stage+2}`;else{document.querySelector('#progress').textContent='DEMO COMPLETE • Four pages verified in sequence';document.querySelector('#next').disabled=true;update('Correct answer — all four pages completed.')}};
document.querySelector('#restart').onclick=()=>{history=[];location.hash='stage1';render()};window.addEventListener('hashchange',render);if(!location.hash)location.hash='stage1';render();
</script></html>
