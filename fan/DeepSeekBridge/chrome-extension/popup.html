<!doctype html><html><head><meta charset="utf-8"><title>Connect Chrome</title>
<style>body{font:14px system-ui;width:360px;padding:14px;color:#182235}input,button{box-sizing:border-box;width:100%;padding:10px;margin:8px 0}button{background:#1257a6;color:white;border:0;border-radius:5px}p{line-height:1.45}small{color:#536178}</style></head><body>
<h2>Use this Chrome window</h2><p>Open LinkedIn or a public job page in the window you already use. Fan will use this window and its existing sign-ins.</p>
<label>Pairing code from Fan<input id="code" autocomplete="off" placeholder="8767.…"></label>
<button id="connect">Connect this normal window</button><button id="disconnect">Disconnect</button>
<button id="reload">Reload updated connector</button>
<p id="status" role="status"></p><small>Chrome displays its debugger banner while Fan observes or fills a job tab. Passwords, verification codes and CAPTCHA require your action.</small>
<script src="popup.js"></script></body></html>
